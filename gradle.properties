# Project-wide Gradle settings.
# Gradle daemon memory: KSP (Hilt, Room) + Compose across nine modules needs more than the default.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Build independent modules in parallel.
org.gradle.parallel=true
# Configuration cache: skip the configuration phase when build scripts haven't changed.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
